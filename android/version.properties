# ImageFilter Mobile 版本号的**单一事实来源**。
#
# 为什么是单独一个文件: Kotlin DSL 里写死 versionName/versionCode 等于又开了一处
# 需要手工同步的地方(交接文档 §9.2 已经要同步桌面端 3 处)。这里收敛成一份,
# 并由 app/build.gradle.kts 的 verifyReleaseVersion 在 **release 构建前**校验:
#   - 两个键都必须存在且格式合法
#   - versionName 必须与桌面端 package.json / tauri.conf.json / Cargo.toml 完全一致
# 不一致 => release 构建**失败**, 而不是默默打出一个版本号对不上的包。
# 规则与手工步骤见 docs/ImageFilter-安卓发版与签名.md。
#
# versionCode 每次发版 +1, **只增不减**(Android 拒绝降级安装, 见 M4′ Task 4 Step 5)。

versionName=1.3.0
versionCode=6