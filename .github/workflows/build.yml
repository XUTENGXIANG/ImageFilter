name: Build Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action 需要创建 release/上传资产
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS: 添加两种架构 target, 构建 universal 包(Intel + Apple Silicon 通用)
      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # macOS 需要 ffmpeg 生成视频缩略图
      - name: Install ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      # 发布约束：Release 简介必须使用 ImageFilter vX.Y.Z / 新增功能：/ 条目 的模板。
      # 对应版本的完整文案写进 docs/ImageFilter-更新说明.md，发布前替换这里的占位。
      - name: Build & upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ImageFilter ${{ github.ref_name }}"
          releaseBody: |
            ImageFilter ${{ github.ref_name }}
            新增功能：
            - 请按 docs/ImageFilter-更新说明.md 对应版本段落填写
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          releaseDraft: true
          prerelease: false
