[package]
name = "image-filter"
version = "1.2.1"
edition = "2021"
license = "MIT"

[lib]
name = "image_filter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.4.2"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 图库服务（手机端访问）。只加 HTTP 框架与随机数, 不引 HTTP 客户端。
axum = "0.8"
getrandom = "0.2"

# 配对二维码(M4′ Task 1): 只用来把"局域网地址 + 配对码"编成能被手机扫的图形, 不参与其它逻辑。
# 默认 feature 里的 `image ^0.25` 与本仓库既有的 `image = "0.25"` 是同一个 semver 要求,
# cargo 会合并到同一份 —— 所以它**没有**带进第二个 image 版本。
qrcode = "0.14"

# Image / photo processing
rawler = "0.7"
kamadak-exif = "0.5"
image = "0.25"
zune-jpeg = "0.4"
# 感知哈希(近重复检测): 用 Czkawka 作者维护的 image_hasher 取代 imgfprint。
# 原因: imgfprint 的 score 是"条件均值"(Hamming 距离 >32/64 的块被排除、不计入分母),
# 大面积平坦区会被放大成高相似度; image_hasher 直接给位级 Hamming 距离, 语义明确、
# 阈值可照抄 Czkawka 的实测档位。详见 docs/ImageFilter-架构与机制走查.md §8.4
image_hasher = "3.1"

# File system
walkdir = "2"

# Checksum & progress
md-5 = "0.10"
sha2 = "0.10"
indicatif = "0.17"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
rayon = "1.12.0"
memmap2 = "0.9.11"

# Windows 专属依赖 — 非 Windows 平台不编译(避免 macOS/Linux 拉取 windows-future 等失败)
# Win32_System_Registry              ← Phase 7: 读 .lrcat 文件关联 / 卸载项, 定位 Lightroom.exe
# Win32_System_Diagnostics_ToolHelp  ← Phase 7: 判断 Lightroom 是否正在运行
# Win32_UI_WindowsAndMessaging       ← Phase 7: 等 Lightroom 主窗口出现(进程出现≠窗口出现)
# Win32_Networking_NetworkListManager ← M4′ Task 2: 读网络类别(公用/专用/域)
# Win32_NetworkManagement_IpHelper + Win32_NetworkManagement_Ndis + Win32_Networking_WinSock
#                                    ← M4′ Task 2: 枚举本机网卡的私有 IPv4 与网卡名
# 注意这几个只是**同一个 windows crate 的 feature**(没有引入新依赖);
# 理由与取舍见 src-tauri/src/server/network.rs 的模块头。
[target.'cfg(target_os = "windows")'.dependencies]
inspect_path = "0.3"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_IO", "Win32_Security", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# zune-jpeg SIMD is slow in debug builds
[profile.dev.package.zune-jpeg]
opt-level = 3

# ── dev(调试)构建的性能配置 ─────────────────────────────────────────────
# 背景: dev 构建默认全部 opt-level=0, 而本项目的重活都在数值循环里
# (JPEG 解码后的色彩转换与重采样、拉普拉斯卷积、大文件字节扫描)。
# 实测同一批 29 张真实照片的分析: debug 63.0s → release 2.17s(29 倍),
# 用户体感就是"AI 分析时 CPU 占满、电脑很卡"。
# 依赖全部 o3(它们的解码/重采样是大头)、本项目代码 o2(编译代价小),
# 让 dev 下的运行速度接近 release。
# 注意: 改动本段会让下次构建**重新编译所有依赖**(一次性, 之后照常增量)。
# 若随后出现 `LNK2019: 无法解析的外部符号 anon.*.llvm.*` 这类链接错误, 那是改 profile 后
# 残留的过期增量产物导致的(与代码无关), 执行一次 `cargo clean -p image-filter` 再构建即可
# (实测残留了 11GiB 过期产物)。
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# 契约测试直接打 Router, 不占端口、不引 HTTP 客户端
tower = { version = "0.5", features = ["util"] }
