[package]
name = "image-filter"
version = "0.1.0"
edition = "2021"

[lib]
name = "image_filter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.4.2"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image / photo processing
rawler = "0.7"
kamadak-exif = "0.5"
image = "0.25"
zune-jpeg = "0.4"
imgfprint = "0.4"

# File system
walkdir = "2"

# Checksum & progress
md-5 = "0.10"
sha2 = "0.10"
indicatif = "0.17"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
rayon = "1.12.0"
memmap2 = "0.9.11"

# Windows 专属依赖 — 非 Windows 平台不编译(避免 macOS/Linux 拉取 windows-future 等失败)
[target.'cfg(target_os = "windows")'.dependencies]
inspect_path = "0.3"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_IO", "Win32_Security"] }

# zune-jpeg SIMD is slow in debug builds
[profile.dev.package.zune-jpeg]
opt-level = 3
